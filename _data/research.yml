        url: https://pretalx.com/juliacon-2026/talk/F3RNYU/
  - title: "Quantum Tanner Codes at Moderate Blocklength"
    authors: "<b>Feroz Ahmed Mian</b>, Vaishnavi L. Addala, Arman Meraj, Adhiraj Chadha, Stefan Krastanov"
    venue: "arXiv 2026"
    note: "preprint"
    year: 2026
    image: /images/research/qt-codes-table.png
    image_dark: /images/research/qt-codes-table-dark.png
    lead: "Explicit quantum Tanner codes from non-abelian groups at moderate blocklength."
    math: |
      $$X\leftrightarrow C_A\otimes C_B,\qquad Z\leftrightarrow C_A^{\perp}\otimes C_B^{\perp}$$
      <p class="math-note">on $\mathrm{Cay}_2(G,A,B)$ with $G$ non-abelian, $\;n\in[500,1000]$, $\;d_{\min}>\sqrt{n}$ for 7 of 8 highlighted codes, $\;p_{\mathrm{th}}^{\mathrm{circ}}\approx 0.14\text{–}0.27\%$</p>
    links:
