software:
  - name: QuantumClifford.jl / QECCore.jl
    url: https://github.com/QuantumSavory/QuantumClifford.jl
    text: "Lead contributor of the error-correcting-code library: MM, generalized toric, D-dimensional surface and toric, non-abelian lifted product, two-block group algebra and tile codes, plus an exact MILP distance solver."
