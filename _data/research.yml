publications:
  - title: "Multivariate Multicycle Codes for Complete Single-Shot Decoding"
    authors: "<b>Feroz Ahmed Mian</b>, Owen Gwilliam, Stefan Krastanov"
    venue: "arXiv:2601.18879"
    scholar: "xdGGmiUAAAAJ:8k81kl-MbHgC"
    note: "under revision"
    year: 2026
    image: /images/research/mm-codes-table.png
    image_dark: /images/research/mm-codes-table-dark.png
    lead: "Koszul-complex description of abelian multicycle codes, with explicit metachecks."
    math: |
      $$S=\mathbb{F}_2[x_1,\dots,x_D]\,/\,\langle x_i^{\ell_i}-1\rangle$$
      $$K_{q-2}\xleftarrow{M_X}K_{q-1}\xleftarrow{P_X}K_{q}\xleftarrow{P_Z^{\top}}K_{q+1}\xleftarrow{M_Z^{\top}}K_{q+2}$$
      <p class="math-note">$K_\bullet(F_1,\dots,F_t;S)$ with $F_i\in S$, $\;t=2q\ge 4$, $\;\operatorname{rank}K_k=\binom{t}{k}$, $\;M_XP_X=0=M_ZP_Z$</p>
    links:
      - label: arXiv
        url: https://arxiv.org/abs/2601.18879
      - label: paper
        url: https://arxiv.org/pdf/2601.18879
      - label: code
        url: https://github.com/QuantumSavory/Multivariate-Multicycle-Codes-For-Complete-Single-Shot-Decoding
      - label: data (Zenodo)
        url: https://doi.org/10.5281/zenodo.18396531
      - label: QEC 2026 poster
        url: https://qec-conference.org/2026/schedule/#tuesday-session
      - label: JuliaCon talk
        url: https://pretalx.com/juliacon-2026/talk/F3RNYU/
  - title: "Quantum Tanner Codes at Moderate Blocklength"
    authors: "<b>Feroz Ahmed Mian</b>, Vaishnavi L. Addala, Arman Meraj, Adhiraj Chadha, Stefan Krastanov"
    venue: "arXiv:2608.12509"
    scholar: "xdGGmiUAAAAJ:UebtZRa9Y70C"
    note: "preprint"
    year: 2026
    image: /images/research/qt-codes-table.png
    image_dark: /images/research/qt-codes-table-dark.png
    lead: "Explicit quantum Tanner codes from non-abelian groups at moderate blocklength."
    math: |
      $$X\leftrightarrow C_A\otimes C_B,\qquad Z\leftrightarrow C_A^{\perp}\otimes C_B^{\perp}$$
      <p class="math-note">on $\mathrm{Cay}_2(G,A,B)$ with $G$ non-abelian, $\;n\in[500,1000]$, $\;d_{\min}>\sqrt{n}$ for 7 of 8 highlighted codes, $\;p_{\mathrm{th}}^{\mathrm{circ}}\approx 0.14\text{–}0.27\%$</p>
    links:
      - label: arXiv
        url: https://arxiv.org/abs/2608.12509
      - label: paper
        url: https://arxiv.org/pdf/2608.12509
      - label: code (QuantumExpanders.jl)
        url: https://github.com/QuantumSavory/QuantumExpanders.jl

  - title: "Optimizing Compilation of Error Correction Codes for 2×n Quantum Dot Arrays and Its NP Hardness"
    authors: "Anthony Micciche, <b>Feroz Ahmed Mian</b>, Anasua Chatterjee, Andrew McGregor, Stefan Krastanov"
    venue: "Phys. Rev. Research 8, 013212"
    scholar: "xdGGmiUAAAAJ:eQOLeE2rZwMC"
    note: "published"
    contribution: "I wrote the Codes Tested section and contributed the code implementations through QuantumClifford.jl."
    year: 2026
    image: /images/research/dots-2xn.svg
    image_dark: /images/research/dots-2xn-dark.svg
    lead: "Compiling syndrome extraction for any CSS code onto two parallel quantum-dot arrays with few shuttles."
    math: |
      $$\#\text{shuttles}_{\min}=w_{\mathrm{col}}(H)$$
      <p class="math-note">for column-regular qLDPC codes with Shor-style extraction; minimizing shuttles for general CSS codes is NP-hard.</p>
    links:
      - label: journal
        url: https://doi.org/10.1103/l5y5-v3k7
      - label: arXiv
        url: https://arxiv.org/abs/2501.09061

