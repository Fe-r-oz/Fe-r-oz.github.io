  - title: "Multivariate Multicycle Codes for Complete Single-Shot Decoding"
    authors: "<b>Feroz Ahmed Mian</b>, Owen Gwilliam, Stefan Krastanov"
    venue: "arXiv 2026"
    note: "under revision"
    year: 2026
    image: /images/research/mm-codes-table.png
    image_dark: /images/research/mm-codes-table-dark.png
    lead: "Koszul-complex description of abelian multicycle codes, with explicit metachecks."
    math: |
      $$S=\mathbb{F}_2[x_1,\dots,x_D]\,/\,\langle x_i^{\ell_i}-1\rangle$$
      $$K_{q-2}\xleftarrow{M_X}K_{q-1}\xleftarrow{P_X}K_{q}\xleftarrow{P_Z^{\top}}K_{q+1}\xleftarrow{M_Z^{\top}}K_{q+2}$$
      <p class="math-note">$K_\bullet(F_1,\dots,F_t;S)$ with $F_i\in S$, $\;t=2q\ge 4$, $\;\operatorname{rank}K_k=\binom{t}{k}$, $\;M_XP_X=0=M_ZP_Z$</p>
    links:
      - label: arXiv
        url: https://arxiv.org/abs/2601.18879
