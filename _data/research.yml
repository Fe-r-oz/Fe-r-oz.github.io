publications:
  - title: "Multivariate Multicycle Codes for Complete Single-Shot Decoding"
    authors: "<b>Feroz Ahmed Mian</b>, Owen Gwilliam, Stefan Krastanov"
    venue: "arXiv 2026"
    note: "under revision"
    year: 2026
    image: /images/research/mm-codes-table.png
    summary: "A Koszul-complex description of abelian multicycle codes that covers bivariate bicycle, multivariate bicycle, 2BGA, generalized bicycle, tricycle and toric codes. It gives closed-form check and metacheck matrices for both sectors, so single-shot decoders can use the check redundancy directly. In our experiments, metachecks improve single-stage BP+OSD, and an overlapping-window decoder reaches low error rates with small windows."
    links:
      - label: arXiv
        url: https://arxiv.org/abs/2601.18879
      - label: paper
        url: https://arxiv.org/pdf/2601.18879
      - label: code
        url: https://github.com/QuantumSavory/Multivariate-Multicycle-Codes-For-Complete-Single-Shot-Decoding
      - label: data (Zenodo)
        url: https://doi.org/10.5281/zenodo.18396531
      - label: QEC 2026 poster
        url: https://qec-conference.org/2026/schedule/#tuesday-session
      - label: JuliaCon talk
        url: https://pretalx.com/juliacon-2026/talk/F3RNYU/
  - title: "Quantum Tanner Codes at Moderate Blocklength"
    authors: "<b>Feroz Ahmed Mian</b>, Vaishnavi L. Addala, Arman Meraj, Adhiraj Chadha, Stefan Krastanov"
    venue: "arXiv 2026"
    note: "preprint"
    year: 2026
    image: /images/research/qt-codes-table.png
    summary: "Do competitive quantum Tanner codes exist at practical sizes? A search over non-abelian groups, using both left–right Cayley complexes and lifts, says yes for n = 500–1000. Distances were cross-checked with QDistRnd and GPU-based sQetch, and the codes reach circuit-level pseudo-thresholds of 0.14–0.27% with the Tesseract decoder."
    links:
      - label: arXiv
        url: https://arxiv.org/abs/2608.12509
      - label: paper
        url: https://arxiv.org/pdf/2608.12509
      - label: code (QuantumExpanders.jl)
        url: https://github.com/QuantumSavory/QuantumExpanders.jl

