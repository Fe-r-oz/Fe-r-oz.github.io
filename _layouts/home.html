<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}Feroz Ahmed Mian</title>
  <meta name="author" content="Feroz Ahmed Mian">
  <meta name="description" content="Feroz Ahmed Mian works on quantum error correction: the algebraic structure of quantum LDPC codes, single-shot decoding and fault-tolerant logic.">
  <meta property="og:title" content="Feroz Ahmed Mian">
  <meta property="og:description" content="Quantum error correction · Computer Science PhD student, UMass Amherst">
  <meta property="og:image" content="{{ '/images/FEROZAHMEDMIAN.jpg' | absolute_url }}">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="{{ '/images/favicon-32x32.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Nastaliq+Urdu:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/home.css' | relative_url }}">
</head>
<body>
  <header class="nav">
    <div class="nav__in">
      <a class="nav__mark" href="{{ '/' | relative_url }}" aria-label="Home">FAM</a>
      <nav>
        <a href="{{ '/' | relative_url }}#about">About</a>
        <a href="{{ '/' | relative_url }}#updates">Updates</a>
        <a href="{{ '/' | relative_url }}#research">Research</a>
        <a href="{{ '/' | relative_url }}#software">Software</a>
        <a href="{{ '/' | relative_url }}#experience">Experience</a>
        <a class="nav__cv" href="{{ '/files/Feroz_Ahmed_Mian_CV.pdf' | relative_url }}">CV</a>
      </nav>
    </div>
  </header>
  <main>
{{ content }}
  </main>
  <footer class="foot">
    <div class="foot__in">
      <span>© {{ site.time | date: "%Y" }} Feroz Ahmed Mian</span>
      <a href="{{ '/awards/' | relative_url }}">Honors and awards</a>
    </div>
  </footer>
  <script>
    // Build the email link in the browser so the address isn't in the page source.
    document.querySelectorAll('[data-mail]').forEach(function (a) {
      a.href = 'mailto:' + a.dataset.mail.split('').reverse().join('');
    });
  </script>
</body>
</html>
